<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#121318">
  <title>PrismatiX Player</title>
  <link rel="stylesheet" href="./styles.css">
</head>
<body>
  <main>
    <canvas id="canvas" width="1280" height="720" tabindex="0" aria-label="遊戲畫面"></canvas>
    <div id="semantics" class="sr-only" role="region" aria-label="遊戲控制項"></div>
    <section id="welcome">
      <p class="eyebrow">PrismatiX Player</p>
      <h1 id="title">載入遊戲資訊…</h1>
      <p>點擊開始啟用聲音。遊戲內容會隨遊玩下載。</p>
      <div class="buttons">
        <button id="start" disabled>開始遊玩</button>
        <button id="download" disabled>下載完整遊戲供離線遊玩</button>
      </div>
      <progress id="download-progress" hidden></progress>
      <p id="download-status" role="status"></p>
    </section>
    <button id="resume" hidden>點擊繼續播放</button>
    <div id="status" role="status" aria-live="polite"></div>
    <details id="tools">
      <summary>Web 選項</summary>
      <button id="fullscreen">全螢幕</button>
      <button id="update" hidden>更新遊戲並重新載入</button>
      <button id="export-saves" disabled>匯出存檔</button>
      <label class="button">匯入存檔<input id="import-saves" type="file" accept=".pxwebsave,application/json" disabled></label>
      <p>匯入後會重新載入遊戲。</p>
      <p><a href="./Notices/WEB-RUNTIME.txt" target="_blank" rel="noopener">開源授權</a> · <a href="./RuntimeSource.tar.gz">引擎原始碼</a> · <a href="./FriBidiSource.tar.gz">FriBidi 原始碼</a></p>
    </details>
  </main>
  <script type="module" src="./player.mjs"></script>
</body>
</html>
