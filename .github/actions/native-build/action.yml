name: Build the native Runtime, SDK, Player and tests
description: >-
  Installs the platform build dependencies, resolves vcpkg.json with the
  pinned vcpkg, configures a Ninja build with tests and warnings as errors,
  and compiles it. Used by the quality gate and the release workflow so both
  build the same way.

  Two caches keep CI fast. The vcpkg binary cache (built ports) is shared by
  every job with the same OS, triplet and vcpkg inputs. A compiler cache keeps
  the object files: ccache on Linux and macOS, sccache on Windows (with /Z7
  embedded debug info, because a shared-PDB /Zi compile cannot be cached).
  macOS and Windows install a pinned, checksum-verified prebuilt release
  rather than Homebrew's ccache, which pulls a newer fmt into /usr/local that
  shadows vcpkg's on Intel macOS (undefined fmt::detail symbols). The caches
  are saved even when a later step fails, so a failing compile does not throw
  away the dependency build or the objects that did compile.

  With cache-write "false" (the release workflow) the vcpkg cache is
  restore-only and ccache is not used at all: a release never writes a cache
  entry that later builds would trust, and its binaries are compiled cold.
  Caches written on a pull request are only readable by that pull request, so
  restoring on master only ever reads entries written by master.

inputs:
  triplet:
    description: vcpkg target triplet (x64-linux, x64-windows, x64-osx, arm64-osx).
    required: true
  build-dir:
    description: CMake binary directory, relative to the workspace.
    required: true
  build-type:
    description: CMAKE_BUILD_TYPE.
    default: RelWithDebInfo
  c-compiler:
    description: CMAKE_C_COMPILER (empty for the platform default).
    default: ""
  cxx-compiler:
    description: CMAKE_CXX_COMPILER (empty for the platform default).
    default: ""
  sanitizers:
    description: PRISMATIX_ENABLE_SANITIZERS (ON or OFF).
    default: "OFF"
  vcpkg-install-root:
    description: Where vcpkg installs the dependencies, relative to the workspace.
    required: true
  cache-write:
    description: >-
      "true" to save the vcpkg binary cache and the compiler cache; "false" to
      only restore the vcpkg binary cache and use no compiler cache.
    default: "true"

runs:
  using: composite
  steps:
    - name: Install Linux build and display dependencies
      if: runner.os == 'Linux'
      shell: bash
      run: bash .github/scripts/install-linux-dependencies.sh
    - name: Install macOS build tools
      if: runner.os == 'macOS'
      shell: bash
      run: brew install autoconf automake libtool nasm pkg-config
    - name: Check the runner architecture matches the triplet
      if: runner.os == 'macOS'
      shell: bash
      run: |
        actual="$(uname -m)"
        case "${{ inputs.triplet }}:$actual" in
          arm64-osx:arm64|x64-osx:x86_64) ;;
          *) echo "::error::triplet ${{ inputs.triplet }} does not match runner architecture $actual"; exit 1 ;;
        esac
    - uses: ilammy/msvc-dev-cmd@0b201ec74fa43914dc39ae48a89fd1d8cb592756
      if: runner.os == 'Windows'
      with:
        arch: x64
    - uses: lukka/get-cmake@80ed063af494e28dd56b85fb7a630f2f8f55ceed
    - uses: lukka/run-vcpkg@b1a0dd252f06b9e25b3c022a9a03bd7a427fb6a2
      with:
        vcpkgDirectory: ${{ runner.temp }}/vcpkg
    # run-vcpkg sets VCPKG_BINARY_SOURCES to the removed x-gha backend; point
    # vcpkg at a workspace directory that actions/cache can persist instead.
    - name: Use a persistent vcpkg binary cache
      id: vcpkg-dir
      shell: bash
      run: |
        workspace="${GITHUB_WORKSPACE//\\//}"
        dir="$workspace/out/ci/vcpkg-binary-cache"
        mkdir -p "$dir"
        {
          echo "VCPKG_DEFAULT_BINARY_CACHE=$dir"
          echo "VCPKG_BINARY_SOURCES=clear;files,$dir,readwrite"
        } >> "$GITHUB_ENV"
        # ImageVersion is a runner environment variable, not an `env` context
        # value, so hand it to the cache keys as a step output.
        echo "image=${ImageVersion:-unknown}" >> "$GITHUB_OUTPUT"
    # The key names everything that decides which ports are built (vcpkg
    # inputs, overlay ports and triplets, the vcpkg baseline) plus the runner
    # image, then the run id. Restore never finds the run's own key, so it
    # takes the newest entry for the same inputs, or failing that the newest
    # older one for this OS, triplet and compiler; vcpkg checks each package's
    # ABI hash, so a stale entry only ever supplies ports that are still
    # valid. The run id keeps an entry from being frozen: an exact key can be
    # saved once, and a run that was cancelled or failed during the install
    # (the save below runs after those too) would otherwise leave a partial
    # set under it for good, rebuilding ffmpeg (20+ minutes) on every run.
    - name: Restore the vcpkg binary cache
      id: vcpkg-cache
      uses: actions/cache/restore@27d5ce7f107fe9357f9df03efb73ab90386fccae
      with:
        path: out/ci/vcpkg-binary-cache
        key: vcpkg-bin-${{ runner.os }}-${{ inputs.triplet }}-${{ inputs.cxx-compiler || 'default' }}-${{ steps.vcpkg-dir.outputs.image }}-${{ hashFiles('vcpkg.json', 'vcpkg-configuration.json', 'vcpkg/**') }}-${{ github.run_id }}
        restore-keys: |
          vcpkg-bin-${{ runner.os }}-${{ inputs.triplet }}-${{ inputs.cxx-compiler || 'default' }}-${{ steps.vcpkg-dir.outputs.image }}-${{ hashFiles('vcpkg.json', 'vcpkg-configuration.json', 'vcpkg/**') }}-
          vcpkg-bin-${{ runner.os }}-${{ inputs.triplet }}-${{ inputs.cxx-compiler || 'default' }}-
    - name: Count the restored vcpkg binary packages
      id: vcpkg-before
      shell: bash
      run: echo "count=$(find out/ci/vcpkg-binary-cache -name '*.zip' | wc -l | tr -d ' ')" >> "$GITHUB_OUTPUT"
    - name: Resolve dependencies
      if: runner.os != 'Windows'
      shell: bash
      run: >-
        "$VCPKG_ROOT/vcpkg" install --triplet "${{ inputs.triplet }}"
        --x-install-root="${{ github.workspace }}/${{ inputs.vcpkg-install-root }}"
    - name: Resolve dependencies
      if: runner.os == 'Windows'
      shell: pwsh
      run: |
        $installRoot = Join-Path $env:GITHUB_WORKSPACE "${{ inputs.vcpkg-install-root }}"
        & "$env:VCPKG_ROOT/vcpkg.exe" install --triplet "${{ inputs.triplet }}" "--x-install-root=$installRoot"
        if ($LASTEXITCODE -ne 0) { throw "vcpkg dependency resolution failed" }
    # Saved right after the install, even if the install itself failed: the
    # ports that did build are kept. Nothing is saved when every port came
    # from the restored entry; the next run restores the newest entry, so a
    # partial one is completed by the run after it.
    - name: Check whether the install built new vcpkg ports
      id: vcpkg-check
      if: always() && inputs.cache-write == 'true'
      shell: bash
      env:
        PX_BEFORE: ${{ steps.vcpkg-before.outputs.count }}
      run: |
        after="$(find out/ci/vcpkg-binary-cache -name '*.zip' | wc -l | tr -d ' ')"
        echo "vcpkg binary packages: ${PX_BEFORE:-0} restored, $after now"
        if [[ "$after" -gt "${PX_BEFORE:-0}" ]]; then echo "save=true" >> "$GITHUB_OUTPUT"; fi
    - name: Save the vcpkg binary cache
      if: always() && inputs.cache-write == 'true' && steps.vcpkg-check.outputs.save == 'true'
      continue-on-error: true
      uses: actions/cache/save@27d5ce7f107fe9357f9df03efb73ab90386fccae
      with:
        path: out/ci/vcpkg-binary-cache
        key: vcpkg-bin-${{ runner.os }}-${{ inputs.triplet }}-${{ inputs.cxx-compiler || 'default' }}-${{ steps.vcpkg-dir.outputs.image }}-${{ hashFiles('vcpkg.json', 'vcpkg-configuration.json', 'vcpkg/**') }}-${{ github.run_id }}
    # Compiler cache, pinned and checksum-verified where it is downloaded.
    # Linux uses the distribution's ccache. macOS and Windows download an
    # official prebuilt release instead of a package manager's: Homebrew's
    # ccache pulls its own fmt into /usr/local, which shadows vcpkg's fmt and
    # breaks the link on Intel macOS. Windows uses sccache, since ccache
    # cannot cache MSVC builds with PDB debug info; CI-only /Z7 (embedded
    # debug info) replaces /Zi there, see the Configure step.
    - name: Install ccache on macOS
      if: runner.os == 'macOS' && inputs.cache-write == 'true'
      shell: bash
      env:
        CCACHE_VERSION: "4.13.6"
        CCACHE_SHA256: "0274210ec9c9936ed5711d59b0de3167a51216a588ddde35f6bc828f366fe6d9"
      run: |
        archive="$RUNNER_TEMP/ccache-$CCACHE_VERSION-darwin.tar.gz"
        curl -fsSL --retry 3 -o "$archive" "https://github.com/ccache/ccache/releases/download/v$CCACHE_VERSION/ccache-$CCACHE_VERSION-darwin.tar.gz"
        echo "$CCACHE_SHA256  $archive" | shasum -a 256 -c -
        mkdir -p "$RUNNER_TEMP/ccache-install"
        tar -xzf "$archive" -C "$RUNNER_TEMP/ccache-install"
        binary="$(find "$RUNNER_TEMP/ccache-install" -type f -name ccache | head -n 1)"
        chmod +x "$binary"
        echo "$(dirname "$binary")" >> "$GITHUB_PATH"
        "$binary" --version | head -n 1
        otool -L "$binary"
    - name: Install sccache on Windows
      if: runner.os == 'Windows' && inputs.cache-write == 'true'
      shell: pwsh
      env:
        SCCACHE_VERSION: "0.17.0"
        SCCACHE_SHA256: "e94cfc5b58cbe439302f586c1d1bd7980c2cd371d47bdf385ade657411e6f3ac"
      run: |
        $name = "sccache-v$env:SCCACHE_VERSION-x86_64-pc-windows-msvc"
        $archive = Join-Path $env:RUNNER_TEMP "$name.zip"
        Invoke-WebRequest -Uri "https://github.com/mozilla/sccache/releases/download/v$env:SCCACHE_VERSION/$name.zip" -OutFile $archive
        $actual = (Get-FileHash -LiteralPath $archive -Algorithm SHA256).Hash.ToLowerInvariant()
        if ($actual -ne $env:SCCACHE_SHA256) { throw "sccache archive checksum mismatch: $actual" }
        $target = Join-Path $env:RUNNER_TEMP "sccache-install"
        Expand-Archive -LiteralPath $archive -DestinationPath $target -Force
        $binary = Get-ChildItem -LiteralPath $target -Recurse -Filter sccache.exe | Select-Object -First 1
        Add-Content -Path $env:GITHUB_PATH -Value $binary.DirectoryName
        & $binary.FullName --version
    # Each cache is capped well below the 10 GB repository budget so the vcpkg
    # binary caches keep their room.
    - name: Prepare the compiler cache
      id: ccache-setup
      if: inputs.cache-write == 'true'
      shell: bash
      run: |
        workspace="${GITHUB_WORKSPACE//\\//}"
        if [[ "$RUNNER_OS" == "Windows" ]]; then
          tool=sccache
          {
            echo "SCCACHE_DIR=$workspace/out/ci/sccache"
            echo "SCCACHE_CACHE_SIZE=2G"
          } >> "$GITHUB_ENV"
        else
          tool=ccache
          {
            echo "CCACHE_DIR=$workspace/out/ci/ccache"
            echo "CCACHE_BASEDIR=$workspace"
            echo "CCACHE_MAXSIZE=400M"
            echo "CCACHE_COMPRESS=1"
            echo "CCACHE_COMPILERCHECK=content"
          } >> "$GITHUB_ENV"
        fi
        mkdir -p "$workspace/out/ci/$tool"
        {
          echo "enabled=true"
          echo "tool=$tool"
          echo "dir=out/ci/$tool"
        } >> "$GITHUB_OUTPUT"
    - name: Restore the compiler cache
      if: steps.ccache-setup.outputs.enabled == 'true'
      uses: actions/cache/restore@27d5ce7f107fe9357f9df03efb73ab90386fccae
      with:
        path: ${{ steps.ccache-setup.outputs.dir }}
        key: ${{ steps.ccache-setup.outputs.tool }}-${{ runner.os }}-${{ inputs.triplet }}-${{ inputs.build-type }}-${{ inputs.sanitizers }}-${{ github.sha }}
        restore-keys: |
          ${{ steps.ccache-setup.outputs.tool }}-${{ runner.os }}-${{ inputs.triplet }}-${{ inputs.build-type }}-${{ inputs.sanitizers }}-
    - name: Configure
      if: runner.os != 'Windows'
      shell: bash
      env:
        PX_C_COMPILER: ${{ inputs.c-compiler }}
        PX_CXX_COMPILER: ${{ inputs.cxx-compiler }}
        PX_CCACHE: ${{ steps.ccache-setup.outputs.enabled }}
      run: |
        compilers=()
        [[ -n "$PX_C_COMPILER" ]] && compilers+=("-DCMAKE_C_COMPILER=$PX_C_COMPILER")
        [[ -n "$PX_CXX_COMPILER" ]] && compilers+=("-DCMAKE_CXX_COMPILER=$PX_CXX_COMPILER")
        if [[ "$PX_CCACHE" == "true" ]]; then
          compilers+=(-DCMAKE_C_COMPILER_LAUNCHER=ccache -DCMAKE_CXX_COMPILER_LAUNCHER=ccache
                      -DCMAKE_OBJC_COMPILER_LAUNCHER=ccache -DCMAKE_OBJCXX_COMPILER_LAUNCHER=ccache)
          ccache --zero-stats
        fi
        cmake -S . -B "${{ inputs.build-dir }}" -G Ninja \
          -DCMAKE_BUILD_TYPE="${{ inputs.build-type }}" \
          "${compilers[@]}" \
          -DCMAKE_TOOLCHAIN_FILE="$VCPKG_ROOT/scripts/buildsystems/vcpkg.cmake" \
          -DVCPKG_TARGET_TRIPLET="${{ inputs.triplet }}" \
          -DVCPKG_INSTALLED_DIR="${{ github.workspace }}/${{ inputs.vcpkg-install-root }}" \
          -DBUILD_TESTING=ON \
          -DPRISMATIX_ENABLE_SANITIZERS="${{ inputs.sanitizers }}" \
          -DPRISMATIX_WARNINGS_AS_ERRORS=ON
    # PowerShell on Windows: Git Bash puts its own link.exe ahead of MSVC's.
    - name: Configure
      if: runner.os == 'Windows'
      shell: pwsh
      env:
        PX_C_COMPILER: ${{ inputs.c-compiler }}
        PX_CXX_COMPILER: ${{ inputs.cxx-compiler }}
        PX_CCACHE: ${{ steps.ccache-setup.outputs.enabled }}
      run: |
        $compilers = @()
        if ($env:PX_C_COMPILER) { $compilers += "-DCMAKE_C_COMPILER=$env:PX_C_COMPILER" }
        if ($env:PX_CXX_COMPILER) { $compilers += "-DCMAKE_CXX_COMPILER=$env:PX_CXX_COMPILER" }
        if ($env:PX_CCACHE -eq 'true') {
          # sccache cannot cache a compile that writes a shared PDB (/Zi), so
          # CI embeds the debug info in each object (/Z7). Local and release
          # builds keep the root CMakeLists.txt default, /Zi.
          $compilers += "-DCMAKE_C_COMPILER_LAUNCHER=sccache", "-DCMAKE_CXX_COMPILER_LAUNCHER=sccache"
          $compilers += "-DCMAKE_MSVC_DEBUG_INFORMATION_FORMAT=Embedded"
          sccache --zero-stats
        }
        cmake -S . -B "${{ inputs.build-dir }}" -G Ninja `
          "-DCMAKE_BUILD_TYPE=${{ inputs.build-type }}" `
          @compilers `
          "-DCMAKE_TOOLCHAIN_FILE=$env:VCPKG_ROOT/scripts/buildsystems/vcpkg.cmake" `
          "-DVCPKG_TARGET_TRIPLET=${{ inputs.triplet }}" `
          "-DVCPKG_INSTALLED_DIR=$env:GITHUB_WORKSPACE/${{ inputs.vcpkg-install-root }}" `
          -DBUILD_TESTING=ON `
          "-DPRISMATIX_ENABLE_SANITIZERS=${{ inputs.sanitizers }}" `
          -DPRISMATIX_WARNINGS_AS_ERRORS=ON
        if ($LASTEXITCODE -ne 0) { throw "CMake configure failed" }
    # Ninja -k 0 keeps compiling after a failure, so one run reports every
    # broken translation unit (and the compiler cache keeps the ones that did build).
    - name: Compile the Runtime, SDK, Player and test surface
      if: runner.os != 'Windows'
      shell: bash
      run: cmake --build "${{ inputs.build-dir }}" --parallel -- -k 0
    - name: Compile the Runtime, SDK, Player and test surface
      if: runner.os == 'Windows'
      shell: pwsh
      run: |
        cmake --build "${{ inputs.build-dir }}" --parallel -- -k 0
        if ($LASTEXITCODE -ne 0) { throw "CMake build failed" }
    # Saved after a failed compile too: ccache keeps every object that did
    # build, so the next push only recompiles what changed.
    - name: Show compiler cache statistics
      if: always() && steps.ccache-setup.outputs.enabled == 'true'
      shell: bash
      env:
        PX_CACHE_TOOL: ${{ steps.ccache-setup.outputs.tool }}
      run: |
        "$PX_CACHE_TOOL" --show-stats || true
        # sccache flushes its cache directory when its server stops.
        if [[ "$PX_CACHE_TOOL" == "sccache" ]]; then sccache --stop-server || true; fi
    - name: Save the compiler cache
      if: always() && steps.ccache-setup.outputs.enabled == 'true'
      continue-on-error: true
      uses: actions/cache/save@27d5ce7f107fe9357f9df03efb73ab90386fccae
      with:
        path: ${{ steps.ccache-setup.outputs.dir }}
        key: ${{ steps.ccache-setup.outputs.tool }}-${{ runner.os }}-${{ inputs.triplet }}-${{ inputs.build-type }}-${{ inputs.sanitizers }}-${{ github.sha }}
