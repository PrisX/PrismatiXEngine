name: PrismatiX SDK parser fuzz

on:
  schedule:
    - cron: "41 17 * * 6"
  workflow_dispatch:

jobs:
  runtime-parser-fuzz:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          submodules: recursive
      - run: bash .github/scripts/install-linux-dependencies.sh
      - uses: lukka/get-cmake@80ed063af494e28dd56b85fb7a630f2f8f55ceed
      - uses: lukka/run-vcpkg@b1a0dd252f06b9e25b3c022a9a03bd7a427fb6a2
        with:
          vcpkgDirectory: ${{ runner.temp }}/vcpkg
      - run: >-
          "$VCPKG_ROOT/vcpkg" install --triplet x64-linux
          --x-install-root="${{ github.workspace }}/out/ci/vcpkg/fuzz"
      - name: Configure Runtime parser fuzzer
        run: |
          cmake -S . -B out/ci/fuzz -G Ninja \
            -DCMAKE_BUILD_TYPE=RelWithDebInfo \
            -DCMAKE_C_COMPILER=clang -DCMAKE_CXX_COMPILER=clang++ \
            -DCMAKE_TOOLCHAIN_FILE="$VCPKG_ROOT/scripts/buildsystems/vcpkg.cmake" \
            -DVCPKG_TARGET_TRIPLET=x64-linux \
            -DVCPKG_INSTALLED_DIR="${{ github.workspace }}/out/ci/vcpkg/fuzz" \
            -DBUILD_TESTING=ON \
            -DPRISMATIX_BUILD_LEGACY_EDITOR=OFF \
            -DPRISMATIX_BUILD_FUZZERS=ON
      - run: cmake --build out/ci/fuzz --target PrismatiXParserFuzz --parallel
      - name: Correctness fuzz execution
        run: out/ci/fuzz/PrismatiXEngine/PrismatiXParserFuzz -max_total_time=1800 -timeout=10
