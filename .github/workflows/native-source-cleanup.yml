name: One-shot Native Source Cleanup

on:
  push:
    branches: [fix/final-production-readiness-gates]

permissions:
  contents: write

jobs:
  cleanup:
    if: github.repository_owner == 'owenliu0924'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: fix/final-production-readiness-gates
      - name: Fix native strict-build failures
        shell: python
        run: |
          from pathlib import Path

          mac = Path("PrismatiXEngine/Engine/Accessibility/PlatformSemanticAdapterMac.mm")
          text = mac.read_text(encoding="utf-8")
          old_role = '    if (role == "dialog") return NSAccessibilityDialogRole;\n'
          new_role = '    if (role == "dialog") return NSAccessibilityWindowRole;\n'
          if old_role not in text:
              raise SystemExit("expected dialog role mapping not found")
          text = text.replace(old_role, new_role, 1)
          old_build = '''        [element setAccessibilityRole:\n            semantics.text && semantics.text->multiline\n                ? NSAccessibilityTextAreaRole\n                : NativeRole(semantics.role)];\n'''
          new_build = '''        [element setAccessibilityRole:\n            semantics.text && semantics.text->multiline\n                ? NSAccessibilityTextAreaRole\n                : NativeRole(semantics.role)];\n        if (semantics.role == "dialog")\n            [element setAccessibilitySubrole:NSAccessibilityDialogSubrole];\n'''
          if old_build not in text:
              raise SystemExit("expected accessibility role assignment not found")
          text = text.replace(old_build, new_build, 1)
          if "NSAccessibilityDialogRole" in text:
              raise SystemExit("invalid dialog role constant still present")
          mac.write_text(text, encoding="utf-8")

          save = Path("PrismatiXEngine/Engine/Progression/SaveSystem.cpp")
          text = save.read_text(encoding="utf-8")
          old = '''Json ScriptActionsToJson(const script::PendingActionsState& state) {\n    Json values=Json::array();for(const auto& pending:state)values.push_back({\n        {"sourceId",pending.sourceId},{"id",pending.id},{"action",pending.invocation.action},\n        {"arguments",VariantObjectToSaveJson(pending.invocation.arguments)},\n        {"context",ActionContextToJson(pending.invocation.context)},\n        {"yieldIndex",pending.yieldIndex},{"waitKind",pending.waitKind},\n        {"handle",pending.handle},{"remainingSeconds",pending.remainingSeconds},\n        {"journal",ScriptJournalToJson(pending.journal)}});return values;\n}\n'''
          new = '''Json ScriptActionsToJson(const script::PendingActionsState& state) {\n    Json values = Json::array();\n    for (const auto& pending : state) {\n        values.push_back({\n            {"sourceId", pending.sourceId},\n            {"id", pending.id},\n            {"action", pending.invocation.action},\n            {"arguments", VariantObjectToSaveJson(pending.invocation.arguments)},\n            {"context", ActionContextToJson(pending.invocation.context)},\n            {"yieldIndex", pending.yieldIndex},\n            {"waitKind", pending.waitKind},\n            {"handle", pending.handle},\n            {"remainingSeconds", pending.remainingSeconds},\n            {"journal", ScriptJournalToJson(pending.journal)}});\n    }\n    return values;\n}\n'''
          if old not in text:
              raise SystemExit("expected ScriptActionsToJson block not found")
          text = text.replace(old, new, 1)
          save.write_text(text, encoding="utf-8")
      - name: Commit fixes and remove one-shot workflow
        shell: bash
        run: |
          git diff --check
          git diff -- PrismatiXEngine/Engine/Accessibility/PlatformSemanticAdapterMac.mm PrismatiXEngine/Engine/Progression/SaveSystem.cpp
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add PrismatiXEngine/Engine/Accessibility/PlatformSemanticAdapterMac.mm PrismatiXEngine/Engine/Progression/SaveSystem.cpp
          git rm .github/workflows/native-source-cleanup.yml
          git commit -m 'fix: correct macOS accessibility and save serialization'
          git push origin HEAD:fix/final-production-readiness-gates
