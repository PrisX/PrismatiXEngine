name: One-shot strict native contract fixes

on:
  push:
    branches:
      - fix/final-production-readiness-gates

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: fix/final-production-readiness-gates
          fetch-depth: 0

      - name: Apply strict native contract fixes
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          def replace_one(path, old, new):
              p = Path(path)
              text = p.read_text()
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{path}: expected one match, found {count}")
              p.write_text(text.replace(old, new, 1))

          replace_one(
              "cmake/GenerateBuiltInShaders.cmake",
              '''    set(dxil_selector
          "    if ((supportedFormats & SDL_GPU_SHADERFORMAT_DXIL) != 0)\\n"
          "        return ShaderBytecodeView{kCompositorDxil, sizeof(kCompositorDxil),\\n"
          "                                  SDL_GPU_SHADERFORMAT_DXIL, \\"main\\"};\\n")''',
              '''    string(CONCAT dxil_selector
          "    if ((supportedFormats & SDL_GPU_SHADERFORMAT_DXIL) != 0)\\n"
          "        return ShaderBytecodeView{kCompositorDxil, sizeof(kCompositorDxil),\\n"
          "                                  SDL_GPU_SHADERFORMAT_DXIL, \\"main\\"};\\n")''')

          replace_one(
              "PrismatiXEngine/Engine/SDK/Ui.h",
              "    std::unordered_map<std::string, UiActionValue> arguments;",
              "    std::unordered_map<std::string, UiActionValue> arguments{};")

          replace_one(
              "PrismatiXEngine/Engine/UI/Behavior/BehaviorGraph.h",
              "    VariantObject properties;",
              "    VariantObject properties{};")
          replace_one(
              "PrismatiXEngine/Engine/UI/Behavior/BehaviorGraph.h",
              "    std::vector<Uuid> continuation;",
              "    std::vector<Uuid> continuation{};")
          replace_one(
              "PrismatiXEngine/Engine/UI/Behavior/BehaviorGraph.h",
              "    VariantObject signalArguments;",
              "    VariantObject signalArguments{};")

          replace_one(
              "PrismatiXEngine/Engine/UI/Animation.h",
              "    std::unordered_map<std::string, Variant> parameters;",
              "    std::unordered_map<std::string, Variant> parameters{};")

          replace_one(
              "PrismatiXEngine/Engine/UI/Binding.h",
              '''        std::vector<std::string> dependencies;
                  Compute compute;''',
              '''        std::vector<std::string> dependencies{};
                  Compute compute{};''')

          replace_one(
              "PrismatiXEngine/Engine/UI/Control.h",
              '''    std::string role;
              std::string label;
              std::string value;
              std::string description;
              std::vector<std::string> states;
              std::vector<std::string> actions;''',
              '''    std::string role{};
              std::string label{};
              std::string value{};
              std::string description{};
              std::vector<std::string> states{};
              std::vector<std::string> actions{};''')
          replace_one(
              "PrismatiXEngine/Engine/UI/Control.h",
              "    std::optional<AccessibilityTextSemantics> text;",
              "    std::optional<AccessibilityTextSemantics> text{};")

          replace_one(
              "PrismatiXEngine/Engine/VN/Runtime/VM.h",
              '''    std::string sourceId;
              std::string operationId;''',
              '''    std::string sourceId{};
              std::string operationId{};''')
          PY

          tmp="$(mktemp -d)"
          printf 'spv' > "$tmp/compositor.spv"
          printf 'dxil' > "$tmp/compositor.dxil"
          printf 'msl' > "$tmp/compositor.msl"
          cmake \
            -DINPUT_SPIRV="$tmp/compositor.spv" \
            -DINPUT_DXIL="$tmp/compositor.dxil" \
            -DINPUT_MSL="$tmp/compositor.msl" \
            -DOUTPUT="$tmp/generated.cpp" \
            -P cmake/GenerateBuiltInShaders.cmake
          GENERATED="$tmp/generated.cpp" python - <<'PY'
          import os
          from pathlib import Path
          text = Path(os.environ["GENERATED"]).read_text()
          if "\n;" in text:
              raise SystemExit("generator still emitted a CMake list semicolon into C++")
          if text.count("SDL_GPU_SHADERFORMAT_DXIL") != 2:
              raise SystemExit("DXIL selector was not emitted exactly once")
          if "return ShaderBytecodeView{kCompositorDxil" not in text:
              raise SystemExit("DXIL bytecode selector is missing")
          PY
          rm -rf "$tmp"

          git rm .github/workflows/one-shot-strict-native-contracts.yml
          git add cmake/GenerateBuiltInShaders.cmake \
                  PrismatiXEngine/Engine/SDK/Ui.h \
                  PrismatiXEngine/Engine/UI/Behavior/BehaviorGraph.h \
                  PrismatiXEngine/Engine/UI/Animation.h \
                  PrismatiXEngine/Engine/UI/Binding.h \
                  PrismatiXEngine/Engine/UI/Control.h \
                  PrismatiXEngine/Engine/VN/Runtime/VM.h
          git diff --cached --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "fix: complete strict native compile contracts"
          git push origin HEAD:fix/final-production-readiness-gates
