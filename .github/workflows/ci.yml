name: PrismatiX Quality Gate

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  schedule:
    - cron: "17 19 * * 5"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CTEST_OUTPUT_ON_FAILURE: "1"

# Everything here runs on GitHub-hosted standard runners, which are free for
# public repositories. The build, test and runtime-bundle steps live in
# .github/actions so the release workflow runs exactly the same gates.
jobs:
  authoring-sdk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
      - uses: ./.github/actions/setup-js
        with:
          build: "false"
      - name: Check release version consistency
        run: node scripts/verify-release-version.mjs
      - name: Check schemas, generated contracts, TypeScript, and golden tests
        run: pnpm run check

  sdk-architecture:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          submodules: recursive
      - name: Runtime and SDK dependency boundary
        run: cmake -DROOT="${{ github.workspace }}/PrismatiXEngine" -P PrismatiXEngine/Tests/SDKArchitectureGate.cmake

  linux-clang-sanitizer:
    strategy:
      fail-fast: false
      matrix:
        include:
          - configuration: Debug
            sanitizers: "ON"
          - configuration: RelWithDebInfo
            sanitizers: "OFF"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          submodules: recursive
      - uses: ./.github/actions/setup-js
      - uses: ./.github/actions/native-build
        with:
          triplet: x64-linux
          build-dir: out/ci/sdk-clang
          build-type: ${{ matrix.configuration }}
          c-compiler: clang
          cxx-compiler: clang++
          sanitizers: ${{ matrix.sanitizers }}
          vcpkg-install-root: out/ci/vcpkg/clang
      - uses: ./.github/actions/native-tests
        with:
          build-dir: out/ci/sdk-clang
          visual-output-dir: out/ci/visual/linux
      - uses: ./.github/actions/runtime-bundle
        with:
          build-dir: out/ci/sdk-clang
          prefix: out/ci/runtime-linux
      - name: Publish Linux GPU visual matrix
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: PrismatiX-GPU-Visual-Linux-${{ matrix.configuration }}-${{ github.run_id }}
          path: out/ci/visual/linux
          if-no-files-found: error
          retention-days: 14

  windows-msvc-sdk:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          submodules: recursive
      - uses: ./.github/actions/setup-js
      - uses: ./.github/actions/native-build
        with:
          triplet: x64-windows
          build-dir: out/ci/sdk-msvc
          vcpkg-install-root: out/ci/vcpkg/msvc
      - name: Execute CLI to native Packager journey on the Starter sample
        shell: pwsh
        run: |
          node scripts/stage-starter-sample.mjs out/ci/starter
          if ($LASTEXITCODE -ne 0) { throw 'Staging the Starter sample failed' }
          node packages/cli/dist/src/cli.js pack out/ci/starter `
            --packager out/ci/sdk-msvc/PrismatiXEngine/PrismatiXPackager.exe `
            --player out/ci/sdk-msvc/PrismatiXEngine/PrismatiXPlayer.exe `
            --output out/ci/cli-starter
          if ($LASTEXITCODE -ne 0) { throw 'CLI to native Packager journey failed' }
          foreach ($path in @(
            'out/ci/cli-starter/Content.pdx',
            'out/ci/cli-starter/Package/manifest.json',
            'out/ci/cli-starter/PrismatiXPlayer.exe'
          )) {
            if (-not (Test-Path -LiteralPath $path -PathType Leaf)) {
              throw "Starter package is missing $path"
            }
          }
      - uses: ./.github/actions/native-tests
        with:
          build-dir: out/ci/sdk-msvc
          visual-output-dir: out/ci/visual/windows
      - name: Publish Windows GPU visual matrix
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: PrismatiX-GPU-Visual-Windows-${{ github.run_id }}
          path: out/ci/visual/windows
          if-no-files-found: error
          retention-days: 14
      - name: Install distributable SDK and PreviewHost
        run: cmake --install out/ci/sdk-msvc --prefix out/ci/sdk-package
      - name: Finalize SDK artifact identity
        shell: pwsh
        run: ./scripts/finalize-sdk-manifest.ps1 -SdkRoot out/ci/sdk-package -TargetTriple x86_64-pc-windows-msvc
      - name: Compile and run installed SDK consumer
        shell: pwsh
        run: |
          cmake -S PrismatiXEngine/Tests/InstalledSDKConsumer `
            -B out/ci/installed-sdk-consumer -G Ninja `
            -DCMAKE_BUILD_TYPE=RelWithDebInfo `
            "-DCMAKE_PREFIX_PATH=$env:GITHUB_WORKSPACE/out/ci/sdk-package" `
            "-DCMAKE_TOOLCHAIN_FILE=$env:VCPKG_ROOT/scripts/buildsystems/vcpkg.cmake" `
            -DVCPKG_TARGET_TRIPLET=x64-windows `
            "-DVCPKG_INSTALLED_DIR=$env:GITHUB_WORKSPACE/out/ci/vcpkg/msvc"
          cmake --build out/ci/installed-sdk-consumer --parallel
          ctest --test-dir out/ci/installed-sdk-consumer -C RelWithDebInfo `
            --output-on-failure --no-tests=error
      - name: Validate installed SDK surface
        shell: pwsh
        run: |
          $required = @(
            "out/ci/sdk-package/include/PrismatiX/Engine/SDK/RuntimeIr.h",
            "out/ci/sdk-package/include/PrismatiX/Engine/SDK/Sdk.h",
            "out/ci/sdk-package/include/PrismatiX/Engine/SDK/PreviewSession.h",
            "out/ci/sdk-package/share/PrismatiX/docs/PrismatiXSDKReference.md",
            "out/ci/sdk-package/share/PrismatiX/contracts/contracts.lock.json",
            "out/ci/sdk-package/share/PrismatiX/authoring-sdk/dist/src/index.js",
            "out/ci/sdk-package/share/PrismatiX/runtime-sdk/dist/src/index.js",
            "out/ci/sdk-package/share/PrismatiX/runtime-sdk/dist/src/index.d.ts",
            "out/ci/sdk-package/share/PrismatiX/runtime-sdk/package.json",
            "out/ci/sdk-package/PrismatiXSDKManifest.json",
            "out/ci/sdk-package/PrismatiXSDKManifest.sha256",
            "out/ci/sdk-package/lib/cmake/PrismatiXSDK/PrismatiXSDKConfig.cmake",
            "out/ci/sdk-package/bin/PrismatiXPreviewHost.exe",
            "out/ci/sdk-package/bin/SDL3.dll"
          )
          foreach ($path in $required) {
            if (-not (Test-Path -LiteralPath $path -PathType Leaf)) {
              throw "SDK artifact is missing $path"
            }
          }
          $manifest = Get-Content -LiteralPath "out/ci/sdk-package/PrismatiXSDKManifest.json" -Raw | ConvertFrom-Json
          if ($manifest.schemaRevision -ne 1 -or
              $manifest.nativeNamespace -ne 'px::sdk::api' -or
              $manifest.artifactSha256 -notmatch '^[0-9a-f]{64}$' -or
              $manifest.manifestSha256 -notmatch '^[0-9a-f]{64}$') {
            throw "Finalized SDK manifest identity is invalid"
          }
      - uses: ./.github/actions/runtime-bundle
        with:
          build-dir: out/ci/sdk-msvc
          prefix: out/ci/runtime-windows
          project-name: "繁中 專案 測試"
      - name: Native Preview UI gate
        shell: pwsh
        run: |
          node scripts/preview-ui-regression.mjs out/ci/sdk-package/bin/PrismatiXPreviewHost.exe
          if ($LASTEXITCODE -ne 0) { throw 'Native Preview UI gate failed' }
      - name: Publish pinned Windows SDK artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: PrismatiXSDK-Windows-x64-${{ github.sha }}
          path: out/ci/sdk-package
          if-no-files-found: error
          retention-days: 14

  macos-apple-clang-sdk:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15-intel
            architecture: x64
            triplet: x64-osx
          - runner: macos-15
            architecture: arm64
            triplet: arm64-osx
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          submodules: recursive
      - uses: ./.github/actions/setup-js
      - uses: ./.github/actions/native-build
        with:
          triplet: ${{ matrix.triplet }}
          build-dir: out/ci/sdk-apple-clang
          vcpkg-install-root: out/ci/vcpkg/apple-clang
      - uses: ./.github/actions/native-tests
        with:
          build-dir: out/ci/sdk-apple-clang
          visual-output-dir: out/ci/visual/macos
      - uses: ./.github/actions/runtime-bundle
        with:
          build-dir: out/ci/sdk-apple-clang
          prefix: out/ci/runtime-macos
      - name: Publish macOS GPU visual matrix
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: PrismatiX-GPU-Visual-macOS-${{ matrix.architecture }}-${{ github.run_id }}
          path: out/ci/visual/macos
          if-no-files-found: error
          retention-days: 14

  emscripten-preview:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          submodules: recursive
      - name: Install build tools
        run: sudo apt-get update && sudo apt-get install -y ninja-build
      - name: Install pinned Emscripten SDK
        run: |
          git clone --depth 1 https://github.com/emscripten-core/emsdk.git "$RUNNER_TEMP/emsdk"
          "$RUNNER_TEMP/emsdk/emsdk" install 6.0.5
          "$RUNNER_TEMP/emsdk/emsdk" activate 6.0.5
      - name: Configure real WASM Preview build
        run: |
          source "$RUNNER_TEMP/emsdk/emsdk_env.sh"
          emcc --version
          emcmake cmake -S . -B out/ci/wasm-preview -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DBUILD_TESTING=OFF \
            -DPRISMATIX_BUILD_WASM_PREVIEW=ON \
            -DPRISMATIX_WARNINGS_AS_ERRORS=ON
      - name: Compile C++ Runtime + QuickJS into WASM
        run: |
          source "$RUNNER_TEMP/emsdk/emsdk_env.sh"
          cmake --build out/ci/wasm-preview --target PrismatiXPreviewWasm --parallel 2
      - name: Verify Preview artifacts
        run: |
          module="$(find out/ci/wasm-preview -type f -name 'prismatix-preview.mjs' -print -quit)"
          wasm="$(find out/ci/wasm-preview -type f -name 'prismatix-preview.wasm' -print -quit)"
          contract="$(find out/ci/wasm-preview -type f -name 'preview-contract.json' -print -quit)"
          test -n "$module" && test -s "$module"
          test -n "$wasm" && test -s "$wasm"
          test -n "$contract" && test -s "$contract"
          grep -q 'createPrismatiXPreview' "$module"
          node scripts/test-wasm-preview.mjs "$module"
          browser="$(command -v google-chrome || command -v google-chrome-stable || command -v chromium)"
          test -n "$browser"
          node scripts/test-wasm-preview-browser.mjs "$module" "$browser"
          echo "module=$module"
          echo "wasm=$wasm"
          echo "contract=$contract"
