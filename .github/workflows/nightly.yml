name: PrismatiX SDK nightly correctness

on:
  schedule:
    - cron: "23 18 * * *"
  workflow_dispatch:

env:
  CTEST_OUTPUT_ON_FAILURE: "1"

jobs:
  gcc-sdk-correctness:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          submodules: recursive
      - run: bash .github/scripts/install-linux-dependencies.sh
      - uses: lukka/get-cmake@80ed063af494e28dd56b85fb7a630f2f8f55ceed
      - uses: lukka/run-vcpkg@b1a0dd252f06b9e25b3c022a9a03bd7a427fb6a2
        with:
          vcpkgDirectory: ${{ runner.temp }}/vcpkg
      - run: >-
          "$VCPKG_ROOT/vcpkg" install --triplet x64-linux
          --x-install-root="${{ github.workspace }}/out/ci/vcpkg/gcc"
      - name: Configure GCC SDK-only build
        run: |
          cmake -S . -B out/ci/sdk-gcc -G Ninja \
            -DCMAKE_BUILD_TYPE=RelWithDebInfo \
            -DCMAKE_C_COMPILER=gcc -DCMAKE_CXX_COMPILER=g++ \
            -DCMAKE_TOOLCHAIN_FILE="$VCPKG_ROOT/scripts/buildsystems/vcpkg.cmake" \
            -DVCPKG_TARGET_TRIPLET=x64-linux \
            -DVCPKG_INSTALLED_DIR="${{ github.workspace }}/out/ci/vcpkg/gcc" \
            -DBUILD_TESTING=ON \
            -DPRISMATIX_BUILD_LEGACY_EDITOR=OFF \
            -DPRISMATIX_WARNINGS_AS_ERRORS=OFF
      - run: cmake --build out/ci/sdk-gcc --target PrismatiXSDKTests --parallel
      - run: >-
          ctest --test-dir out/ci/sdk-gcc -L "runtime|contract|sdk"
          --output-on-failure --timeout 300 --no-tests=error
